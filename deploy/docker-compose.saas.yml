services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile.saas
    environment:
      MATTERVIS_DATABASE_URL: postgresql+psycopg://mattervis:mattervis@postgres:5432/mattervis
      MATTERVIS_REDIS_URL: redis://redis:6379/0
      MATTERVIS_JOB_BACKEND: redis
      MATTERVIS_OBJECT_STORE_BACKEND: s3
      MATTERVIS_S3_ENDPOINT_URL: http://minio:9000
      MATTERVIS_S3_REGION: us-east-1
      MATTERVIS_S3_ACCESS_KEY: mattervis
      MATTERVIS_S3_SECRET_KEY: mattervis-development-secret
      MATTERVIS_OBJECT_STORE_BUCKET: mattervis
      MATTERVIS_AUTH_MODE: proxy
      MATTERVIS_ARTIFACT_SIGNING_KEY: ${MATTERVIS_ARTIFACT_SIGNING_KEY:-change-me}
    ports:
      - "50001:50001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  worker:
    build:
      context: ..
      dockerfile: Dockerfile.saas
    command: ["python", "-m", "mat_viewer.saas_worker"]
    environment:
      MATTERVIS_DATABASE_URL: postgresql+psycopg://mattervis:mattervis@postgres:5432/mattervis
      MATTERVIS_REDIS_URL: redis://redis:6379/0
      MATTERVIS_JOB_BACKEND: redis
      MATTERVIS_OBJECT_STORE_BACKEND: s3
      MATTERVIS_S3_ENDPOINT_URL: http://minio:9000
      MATTERVIS_S3_REGION: us-east-1
      MATTERVIS_S3_ACCESS_KEY: mattervis
      MATTERVIS_S3_SECRET_KEY: mattervis-development-secret
      MATTERVIS_OBJECT_STORE_BUCKET: mattervis
      MATTERVIS_AUTH_MODE: proxy
      MATTERVIS_ARTIFACT_SIGNING_KEY: ${MATTERVIS_ARTIFACT_SIGNING_KEY:-change-me}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mattervis
      POSTGRES_USER: mattervis
      POSTGRES_PASSWORD: mattervis
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mattervis -d mattervis"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mattervis-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mattervis
      MINIO_ROOT_PASSWORD: mattervis-development-secret
    ports:
      - "9001:9001"
    volumes:
      - mattervis-minio:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      "mc alias set local http://minio:9000 mattervis mattervis-development-secret
      && mc mb --ignore-existing local/mattervis"

volumes:
  mattervis-postgres:
  mattervis-minio:
