name: Compatibility drift

# Not a merge gate. This workflow is not triggered by a pull request.
# A red run means the floating toolchain no longer passes the fast suite
# or can no longer launch Chrome. Keep the jobs required for this file.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  floating-fast-tests:
    name: Floating toolchain fast tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Chrome
        id: chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install floating test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,test]"
          npm install --no-save playwright-core
          python .github/scripts/record_ci_environment.py --output-dir ci-diagnostics --expected-runner ubuntu-latest

      - name: Launch Chrome with floating Playwright
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: node .github/scripts/chrome_playwright_probe.js

      - name: Run fast tests
        run: |
          set -o pipefail
          python -m pytest tests/ -n 4 --dist loadfile \
            -m "not integration and not slow and not browser" \
            --junitxml=pytest-drift.xml

      - name: Write failure signatures
        if: always()
        run: python .github/scripts/junit_failure_signatures.py pytest-drift.xml --output ci-diagnostics/failure-signatures.json

      - name: Upload drift diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-drift
          path: |
            ci-diagnostics/
            pytest-drift.xml
          if-no-files-found: ignore
