name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  MOLCRYSKIT_MINIMUM: "0.7.0"

jobs:
  release-checks:
    name: Release metadata checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vX.Y.Z: ${TAG}" >&2
            exit 1
          fi

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${TAG#v}" >> "${GITHUB_OUTPUT}"

  tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: release-checks
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install minimum chemistry dependency and all test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "molcrys-kit==${MOLCRYSKIT_MINIMUM}"
          python -m pip install -e ".[all,test]"

      - name: Run tests
        run: pytest tests/

  build-package:
    name: Build package distributions
    runs-on: ubuntu-latest
    needs: [release-checks, tests]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify built version
        env:
          EXPECTED_VERSION: ${{ needs.release-checks.outputs.version }}
        run: |
          python -m pip install --no-deps dist/*.whl
          python - <<'PY'
          import importlib.metadata
          import os

          actual = importlib.metadata.version("matter-vis")
          expected = os.environ["EXPECTED_VERSION"]
          if actual != expected:
              raise SystemExit(f"Built version {actual!r} does not match tag version {expected!r}")
          print(f"matter-vis {actual}")
          PY

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [release-checks, build-package]
    environment:
      name: pypi
      url: https://pypi.org/project/matter-vis/
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  create-github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release-checks, publish-pypi]
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
