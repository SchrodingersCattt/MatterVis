name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MOLCRYSKIT_MINIMUM: "0.7.0"

jobs:
  fast-tests:
    name: Fast tests (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install minimum chemistry dependency and all test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "molcrys-kit==${MOLCRYSKIT_MINIMUM}"
          python -m pip install -e ".[all,test]"

      - name: Run fast tests
        run: |
          set -o pipefail
          python -m pytest tests/ -n 4 --dist loadfile \
            -m "not integration and not slow" \
            --durations=25 --durations-min=0.25 \
            --junitxml=pytest-fast.xml | tee pytest-fast.log

      - name: Upload fast-test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-fast-python-3.12
          path: |
            pytest-fast.log
            pytest-fast.xml

  full-tests:
    name: Full tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install minimum chemistry dependency and all test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "molcrys-kit==${MOLCRYSKIT_MINIMUM}"
          python -m pip install -e ".[all,test]"

      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest tests/ -n 4 --dist loadfile \
            --durations=50 --durations-min=0.25 \
            --junitxml=pytest-full-${{ matrix.python-version }}.xml \
            | tee pytest-full-${{ matrix.python-version }}.log

      - name: Upload full-test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-full-python-${{ matrix.python-version }}
          path: |
            pytest-full-${{ matrix.python-version }}.log
            pytest-full-${{ matrix.python-version }}.xml

  minimal-install:
    name: Minimal base install and CPU smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install minimum chemistry dependency and base MatterVis only
        run: |
          python -m pip install --upgrade pip
          python -m pip install "molcrys-kit==${MOLCRYSKIT_MINIMUM}"
          python -m pip install .
          python -m pip check

      - name: Verify browser-free CIF to PNG, PDF, and SVG
        run: python tests/minimal_install_smoke.py

  build-package:
    name: Build source and wheel distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify wheel contains only the mat_viewer package
        shell: python
        run: |
          import glob
          import zipfile

          wheel, = glob.glob("dist/*.whl")
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          assert any(name.startswith("mat_viewer/") for name in names), names
          assert not any(name.startswith("crystal_viewer/") for name in names), names
