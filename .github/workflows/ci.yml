name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MOLCRYSKIT_MINIMUM: "0.8.0"
  MOLCRYSKIT_UPPER: "0.9.0"
  # Deliberate toolchain baseline. The compatibility-drift workflow is the
  # place that floats these. A run_attempt above 1 is a rerun, not a clean
  # first-attempt success. Cancellations are concurrency, not flakes.
  CI_NODE_VERSION: "22.23.4"
  CI_CHROME_VERSION: "156.0.8078.47"
  CI_PLAYWRIGHT_CORE: "1.64.1"
  CI_PIP_VERSION: "26.3"

jobs:
  fast-tests:
    name: Fast tests (Python 3.12, pinned molcrys-kit)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned molcrys-kit and test dependencies
        run: |
          python -m pip install "pip==${CI_PIP_VERSION}"
          python -m pip install -c requirements/ci-constraints.txt -e ".[all,test]"
          python - << 'PY'
          import os
          from importlib.metadata import version
          from molcrys_kit.structures import BondRecord
          from molcrys_kit.structures.crystal import MolecularCrystal

          def parse_version(raw: str) -> tuple[int, int, int]:
              parts: list[int] = []
              for piece in raw.split("."):
                  digits = ""
                  for char in piece:
                      if char.isdigit():
                          digits += char
                      else:
                          break
                  if not digits:
                      break
                  parts.append(int(digits))
              while len(parts) < 3:
                  parts.append(0)
              return tuple(parts[:3])

          raw = version("molcrys-kit")
          got = parse_version(raw)
          minimum = parse_version(os.environ["MOLCRYSKIT_MINIMUM"])
          upper = parse_version(os.environ["MOLCRYSKIT_UPPER"])
          if not (minimum <= got < upper):
              raise SystemExit(
                  f"molcrys-kit {raw} is outside "
                  f">={os.environ['MOLCRYSKIT_MINIMUM']},"
                  f"<{os.environ['MOLCRYSKIT_UPPER']}"
              )
          if "role" not in getattr(BondRecord, "__dataclass_fields__", {}):
              raise SystemExit("installed molcrys-kit is missing BondRecord.role")
          report = getattr(MolecularCrystal, "get_connectivity_report", None)
          if not callable(report):
              raise SystemExit(
                  "installed molcrys-kit is missing "
                  "MolecularCrystal.get_connectivity_report"
              )
          print(f"molcrys-kit {raw} (BondRecord.role, get_connectivity_report)")
          PY
          python .github/scripts/record_ci_environment.py --output-dir ci-diagnostics --expected-runner ubuntu-24.04

      - name: Run fast tests
        run: |
          set -o pipefail
          python -m pytest tests/ -n 4 --dist loadfile \
            -m "not integration and not slow and not browser" \
            --durations=25 --durations-min=0.25 \
            --junitxml=pytest-fast.xml | tee pytest-fast.log

      - name: Write fast-test failure signatures
        if: always()
        run: python .github/scripts/junit_failure_signatures.py pytest-fast.xml --output ci-diagnostics/failure-signatures.json

      - name: Upload fast-test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-fast-python-3.12
          path: |
            pytest-fast.log
            pytest-fast.xml
            ci-diagnostics/

  full-tests:
    name: Full tests (Python ${{ matrix.python-version }}, pinned molcrys-kit)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pinned molcrys-kit and test dependencies
        run: |
          python -m pip install "pip==${CI_PIP_VERSION}"
          python -m pip install -c requirements/ci-constraints.txt -e ".[all,test]"
          python - << 'PY'
          from molcrys_kit.structures import BondRecord
          from molcrys_kit.structures.crystal import MolecularCrystal
          if "role" not in getattr(BondRecord, "__dataclass_fields__", {}):
              raise SystemExit("installed molcrys-kit is missing BondRecord.role")
          report = getattr(MolecularCrystal, "get_connectivity_report", None)
          if not callable(report):
              raise SystemExit(
                  "installed molcrys-kit is missing "
                  "MolecularCrystal.get_connectivity_report"
              )
          PY
          python .github/scripts/record_ci_environment.py --output-dir ci-diagnostics --expected-runner ubuntu-24.04

      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest tests/ -n 4 --dist loadfile \
            -m "not browser" \
            --durations=50 --durations-min=0.25 \
            --junitxml=pytest-full-${{ matrix.python-version }}.xml \
            | tee pytest-full-${{ matrix.python-version }}.log

      - name: Write full-test failure signatures
        if: always()
        run: python .github/scripts/junit_failure_signatures.py pytest-full-${{ matrix.python-version }}.xml --output ci-diagnostics/failure-signatures.json

      - name: Upload full-test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-full-python-${{ matrix.python-version }}
          path: |
            pytest-full-${{ matrix.python-version }}.log
            pytest-full-${{ matrix.python-version }}.xml
            ci-diagnostics/

  minimal-install:
    name: Minimal base install and CPU smoke test
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install base MatterVis with pinned molcrys-kit
        run: |
          python -m pip install "pip==${CI_PIP_VERSION}"
          python -m pip install -c requirements/ci-constraints.txt .
          python - << 'PY'
          from molcrys_kit.structures import BondRecord
          from molcrys_kit.structures.crystal import MolecularCrystal
          if "role" not in getattr(BondRecord, "__dataclass_fields__", {}):
              raise SystemExit("installed molcrys-kit is missing BondRecord.role")
          report = getattr(MolecularCrystal, "get_connectivity_report", None)
          if not callable(report):
              raise SystemExit(
                  "installed molcrys-kit is missing "
                  "MolecularCrystal.get_connectivity_report"
              )
          PY
          python -m pip check
          python .github/scripts/record_ci_environment.py --output-dir ci-diagnostics --expected-runner ubuntu-24.04

      - name: Verify browser-free CIF to PNG, PDF, and SVG
        run: python tests/minimal_install_smoke.py

      - name: Upload minimal-install environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-minimal-install
          path: ci-diagnostics/
          if-no-files-found: ignore

  camera-webgl:
    name: Camera WebGL regression
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.CI_NODE_VERSION }}

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: ${{ env.CI_CHROME_VERSION }}

      - name: Install pinned molcrys-kit and test dependencies
        run: |
          python -m pip install "pip==${CI_PIP_VERSION}"
          python -m pip install -c requirements/ci-constraints.txt -e ".[all,test]"
          python - << 'PY'
          from molcrys_kit.structures import BondRecord
          from molcrys_kit.structures.crystal import MolecularCrystal
          if "role" not in getattr(BondRecord, "__dataclass_fields__", {}):
              raise SystemExit("installed molcrys-kit is missing BondRecord.role")
          report = getattr(MolecularCrystal, "get_connectivity_report", None)
          if not callable(report):
              raise SystemExit(
                  "installed molcrys-kit is missing "
                  "MolecularCrystal.get_connectivity_report"
              )
          PY
          npm install --no-save "playwright-core@${CI_PLAYWRIGHT_CORE}"
          python .github/scripts/record_ci_environment.py --output-dir ci-diagnostics --expected-runner ubuntu-24.04

      - name: Run orthographic, perspective, and reset browser regression
        env:
          MATTERVIS_REQUIRE_BROWSER: "1"
        run: python -m pytest tests/app/test_camera_browser_regression.py tests/app/test_real_app_browser_regression.py tests/app/test_layout_responsive.py tests/app/test_status_bar_browser.py -q --tb=short --junitxml=pytest-browser.xml

      - name: Write browser failure signatures
        if: always()
        run: python .github/scripts/junit_failure_signatures.py pytest-browser.xml --output ci-diagnostics/failure-signatures.json

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-browser
          path: |
            ci-diagnostics/
            pytest-browser.xml
          if-no-files-found: ignore

      - name: Upload browser failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifacts
          path: browser-artifacts/
          if-no-files-found: ignore

      - name: Upload browser failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifacts
          path: browser-artifacts/
          if-no-files-found: ignore

  benchmark-smoke:
    name: Benchmark manifest smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned molcrys-kit and benchmark dependencies
        run: |
          python -m pip install "pip==${CI_PIP_VERSION}"
          python -m pip install -c requirements/ci-constraints.txt -e ".[all,test]"
          python - << 'PY'
          from molcrys_kit.structures import BondRecord
          from molcrys_kit.structures.crystal import MolecularCrystal
          if "role" not in getattr(BondRecord, "__dataclass_fields__", {}):
              raise SystemExit("installed molcrys-kit is missing BondRecord.role")
          report = getattr(MolecularCrystal, "get_connectivity_report", None)
          if not callable(report):
              raise SystemExit(
                  "installed molcrys-kit is missing "
                  "MolecularCrystal.get_connectivity_report"
              )
          PY
          python .github/scripts/record_ci_environment.py --output-dir ci-diagnostics --expected-runner ubuntu-24.04

      - name: Run stable benchmark smoke subset
        run: |
          python -m mat_viewer.perf.runner --smoke \
            --output benchmark-smoke.json --csv benchmark-smoke.csv

      - name: Upload benchmark smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mattervis-benchmark-smoke
          path: |
            benchmark-smoke.json
            benchmark-smoke.csv
            ci-diagnostics/
          if-no-files-found: ignore

  build-package:
    name: Build source and wheel distributions
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build distributions
        env:
          PIP_CONSTRAINT: requirements/ci-constraints.txt
        run: |
          python -m pip install "pip==${CI_PIP_VERSION}"
          python -m pip install -c requirements/ci-constraints.txt build setuptools "setuptools-scm[toml]"
          python -m build --no-isolation
          python .github/scripts/record_ci_environment.py --output-dir ci-diagnostics --expected-runner ubuntu-24.04

      - name: Verify wheel contains only the mat_viewer package
        shell: python
        run: |
          import glob
          from pathlib import Path
          import zipfile

          wheel, = glob.glob("dist/*.whl")
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          assert any(name.startswith("mat_viewer/") for name in names), sorted(names)[:20]
          assert not any(name.startswith("crystal_viewer/") for name in names), names
          missing = []
          for path in Path("skills").rglob("*"):
              if path.is_dir() and not path.is_symlink():
                  continue
              packaged = "mat_viewer/_bundled_skills/" + path.relative_to("skills").as_posix()
              if packaged not in names:
                  missing.append(packaged)
          assert not missing, missing

      - name: Upload package-build environment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics-package-build
          path: ci-diagnostics/
          if-no-files-found: ignore

  # Warn-only. A checkout or script failure here must not fail the workflow.
  # The script exits 0 and emits a warning annotation.
  docs-policy-warn:
    name: Docs policy (warn only)
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Warn when code changes lack docs or an exemption
        continue-on-error: true
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          DOCS_POLICY_BASE_REF: ${{ github.base_ref }}
          DOCS_POLICY_BASE: origin/${{ github.base_ref }}
        run: python3 .github/scripts/docs_policy_warn.py
