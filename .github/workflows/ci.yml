name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  MOLCRYSKIT_CONTRACT_SHA: f2188c14e245b87d99dc1d13ab72e37993d972b0

jobs:
  full-tests:
    name: Full tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pinned chemistry contract and all test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "molcrys-kit @ git+https://github.com/SchrodingersCattt/MolCrysKit.git@${MOLCRYSKIT_CONTRACT_SHA}"
          python -m pip install -e ".[all,test]"

      - name: Run tests
        run: pytest tests/

  minimal-install:
    name: Minimal base install and CPU smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned chemistry contract and base MatterVis only
        run: |
          python -m pip install --upgrade pip
          python -m pip install "molcrys-kit @ git+https://github.com/SchrodingersCattt/MolCrysKit.git@${MOLCRYSKIT_CONTRACT_SHA}"
          python -m pip install .
          python -m pip check

      - name: Verify browser-free CIF to PNG, PDF, and SVG
        run: python tests/minimal_install_smoke.py

  build-package:
    name: Build source and wheel distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify wheel contains only the mat_viewer package
        shell: python
        run: |
          import glob
          import zipfile

          wheel, = glob.glob("dist/*.whl")
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
          assert any(name.startswith("mat_viewer/") for name in names), names
          assert not any(name.startswith("crystal_viewer/") for name in names), names
