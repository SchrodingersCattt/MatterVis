name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  MOLCRYSKIT_MINIMUM: "0.8.0"
  MOLCRYSKIT_UPPER: "0.9.0"

jobs:
  fast-tests:
    name: Fast tests (Python 3.12, pinned molcrys-kit)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned chemistry dependency and all test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,test]"
          python - << 'PY'
          import os
          from importlib.metadata import version
          from molcrys_kit.structures import BondRecord
          from molcrys_kit.structures.crystal import MolecularCrystal

          def parse_version(raw: str) -> tuple[int, int, int]:
              parts: list[int] = []
              for piece in raw.split("."):
                  digits = ""
                  for char in piece:
                      if char.isdigit():
                          digits += char
                      else:
                          break
                  if not digits:
                      break
                  parts.append(int(digits))
              while len(parts) < 3:
                  parts.append(0)
              return tuple(parts[:3])

          raw = version("molcrys-kit")
          got = parse_version(raw)
          minimum = parse_version(os.environ["MOLCRYSKIT_MINIMUM"])
          upper = parse_version(os.environ["MOLCRYSKIT_UPPER"])
          if not (minimum <= got < upper):
              raise SystemExit(
                  f"molcrys-kit {raw} is outside "
                  f">={os.environ['MOLCRYSKIT_MINIMUM']},"
                  f"<{os.environ['MOLCRYSKIT_UPPER']}"
              )
          if "role" not in getattr(BondRecord, "__dataclass_fields__", {}):
              raise SystemExit("installed molcrys-kit is missing BondRecord.role")
          report = getattr(MolecularCrystal, "get_connectivity_report", None)
          if not callable(report):
              raise SystemExit(
                  "installed molcrys-kit is missing "
                  "MolecularCrystal.get_connectivity_report"
              )
          print(f"molcrys-kit {raw} (BondRecord.role, get_connectivity_report)")
          PY

      - name: Run fast tests
        run: |
          set -o pipefail
          python -m pytest tests/ -n 4 --dist loadfile \
            -m "not integration and not slow and not browser" \
            --durations=25 --durations-min=0.25 \
            --junitxml=pytest-fast.xml | tee pytest-fast.log

      - name: Upload fast-test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-fast-python-3.12
          path: |
            pytest-fast.log
            pytest-fast.xml

  full-tests:
    name: Full tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install minimum chemistry dependency and all test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,test]"
          python - << 'PY'
          from molcrys_kit.structures import BondRecord
          from molcrys_kit.structures.crystal import MolecularCrystal
          if "role" not in getattr(BondRecord, "__dataclass_fields__", {}):
              raise SystemExit("installed molcrys-kit is missing BondRecord.role")
          report = getattr(MolecularCrystal, "get_connectivity_report", None)
          if not callable(report):
              raise SystemExit(
                  "installed molcrys-kit is missing "
                  "MolecularCrystal.get_connectivity_report"
              )
          PY

      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest tests/ -n 4 --dist loadfile \
            -m "not browser" \
            --durations=50 --durations-min=0.25 \
            --junitxml=pytest-full-${{ matrix.python-version }}.xml \
            | tee pytest-full-${{ matrix.python-version }}.log

      - name: Upload full-test timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-full-python-${{ matrix.python-version }}
          path: |
            pytest-full-${{ matrix.python-version }}.log
            pytest-full-${{ matrix.python-version }}.xml

  minimal-install:
    name: Minimal base install and CPU smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install minimum chemistry dependency and base MatterVis only
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python - << 'PY'
          from molcrys_kit.structures import BondRecord
          from molcrys_kit.structures.crystal import MolecularCrystal
          if "role" not in getattr(BondRecord, "__dataclass_fields__", {}):
              raise SystemExit("installed molcrys-kit is missing BondRecord.role")
          report = getattr(MolecularCrystal, "get_connectivity_report", None)
          if not callable(report):
              raise SystemExit(
                  "installed molcrys-kit is missing "
                  "MolecularCrystal.get_connectivity_report"
              )
          PY
          python -m pip check

      - name: Verify browser-free CIF to PNG, PDF, and SVG
        run: python tests/minimal_install_smoke.py

  camera-webgl:
    name: Camera WebGL regression
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,test]"
          python - << 'PY'
          from molcrys_kit.structures import BondRecord
          from molcrys_kit.structures.crystal import MolecularCrystal
          if "role" not in getattr(BondRecord, "__dataclass_fields__", {}):
              raise SystemExit("installed molcrys-kit is missing BondRecord.role")
          report = getattr(MolecularCrystal, "get_connectivity_report", None)
          if not callable(report):
              raise SystemExit(
                  "installed molcrys-kit is missing "
                  "MolecularCrystal.get_connectivity_report"
              )
          PY
          npm install --no-save playwright-core

      - name: Run orthographic, perspective, and reset browser regression
        env:
          MATTERVIS_REQUIRE_BROWSER: "1"
        run: python -m pytest tests/app/test_camera_browser_regression.py tests/app/test_real_app_browser_regression.py tests/app/test_layout_responsive.py tests/app/test_status_bar_browser.py -q --tb=short

  benchmark-smoke:
    name: Benchmark manifest smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[all,test]"
          python - << 'PY'
          from molcrys_kit.structures import BondRecord
          from molcrys_kit.structures.crystal import MolecularCrystal
          if "role" not in getattr(BondRecord, "__dataclass_fields__", {}):
              raise SystemExit("installed molcrys-kit is missing BondRecord.role")
          report = getattr(MolecularCrystal, "get_connectivity_report", None)
          if not callable(report):
              raise SystemExit(
                  "installed molcrys-kit is missing "
                  "MolecularCrystal.get_connectivity_report"
              )
          PY

      - name: Run stable benchmark smoke subset
        run: |
          python -m mat_viewer.perf.runner --smoke \
            --output benchmark-smoke.json --csv benchmark-smoke.csv

      - name: Upload benchmark smoke results
        uses: actions/upload-artifact@v4
        with:
          name: mattervis-benchmark-smoke
          path: |
            benchmark-smoke.json
            benchmark-smoke.csv

  build-package:
    name: Build source and wheel distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify wheel contains only the mat_viewer package
        shell: python
        run: |
          import glob
          from pathlib import Path
          import zipfile

          wheel, = glob.glob("dist/*.whl")
          with zipfile.ZipFile(wheel) as archive:
              names = set(archive.namelist())
          assert any(name.startswith("mat_viewer/") for name in names), sorted(names)[:20]
          assert not any(name.startswith("crystal_viewer/") for name in names), names
          missing = []
          for path in Path("skills").rglob("*"):
              if path.is_dir() and not path.is_symlink():
                  continue
              packaged = "mat_viewer/_bundled_skills/" + path.relative_to("skills").as_posix()
              if packaged not in names:
                  missing.append(packaged)
          assert not missing, missing

  # Warn-only. continue-on-error keeps a checkout or script failure from
  # failing the workflow. The script exits 0 and emits ::warning::.
  docs-policy-warn:
    name: Docs policy (warn only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Warn when code changes lack docs or an exemption
        continue-on-error: true
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          DOCS_POLICY_BASE_REF: ${{ github.base_ref }}
          DOCS_POLICY_BASE: origin/${{ github.base_ref }}
        run: python3 .github/scripts/docs_policy_warn.py
