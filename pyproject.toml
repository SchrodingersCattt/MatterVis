[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "matter-vis"
version = "0.1.0"
description = "Publication-quality crystal structure visualization + terminal viewer"
requires-python = ">=3.10"
dependencies = [
    "dash",
    "plotly",
    "numpy",
    "scipy",
    "scikit-image",
    "gemmi",
    "pymatgen",
    "kaleido",
    "flask-sock",
    "flask-compress",
    "matplotlib",
    "pillow",
    "ase",
    "networkx",
    "textual",
    "molcrys-kit>=0.6.1",
]

[project.scripts]
matvis = "crystal_viewer.cli:main"

[tool.setuptools.packages.find]
include = ["crystal_viewer*"]
