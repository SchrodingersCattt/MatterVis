[build-system]
requires = ["setuptools>=68.0", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "matter-vis"
dynamic = ["version"]
description = "Publication-quality atomistic structure and trajectory visualization — CLI, browser viewer, animation, ORTEP, and terminal TUI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "numpy",
    "matplotlib",
    "pillow",
    "ase",
    "molcrys-kit>=0.6.2.dev11",
]

[project.scripts]
mat-vis = "mat_viewer.cli:main"

[project.optional-dependencies]
plotly = ["plotly"]
plotly-export = ["plotly", "kaleido"]
web = ["plotly", "dash", "flask-sock", "flask-compress"]
tui = ["textual"]
cube = ["scikit-image"]
animation = ["imageio", "imageio-ffmpeg"]
all = [
    "plotly",
    "kaleido",
    "dash",
    "flask-sock",
    "flask-compress",
    "textual",
    "scikit-image",
    "imageio",
    "imageio-ffmpeg",
]
test = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-timeout",
    "gemmi",
    "tomli; python_version < '3.11'",
]
dev = ["matter-vis[all,test]", "build", "ruff"]

[tool.setuptools.packages.find]
include = ["mat_viewer*"]

[tool.setuptools_scm]
write_to = "mat_viewer/_version.py"
local_scheme = "no-local-version"
fallback_version = "0.0.0+unknown"
