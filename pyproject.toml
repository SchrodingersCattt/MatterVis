[build-system]
requires = ["setuptools>=68.0", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "matter-vis"
dynamic = ["version"]
description = "Publication-quality crystal structure visualization + terminal viewer"
requires-python = ">=3.10"
dependencies = [
    "dash",
    "plotly",
    "numpy",
    "scipy",
    "scikit-image",
    "gemmi",
    "pymatgen",
    "kaleido",
    "flask-sock",
    "flask-compress",
    "matplotlib",
    "pillow",
    "ase",
    "networkx",
    "textual",
    "molcrys-kit>=0.6.1",
]

[project.scripts]
mat-vis = "crystal_viewer.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov"]
dev = ["matter-vis[test]", "build", "ruff"]

[tool.setuptools.packages.find]
include = ["crystal_viewer*"]

[tool.setuptools_scm]
write_to = "crystal_viewer/_version.py"
local_scheme = "no-local-version"
fallback_version = "0.0.0+unknown"
