[build-system]
requires = ["setuptools>=68.0", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "matter-vis"
dynamic = ["version"]
description = "Publication-quality atomistic structure and trajectory visualization — CLI, browser viewer, animation, ORTEP, and terminal TUI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    # Library ranges stay here. The merge gate installs
    # requirements/ci-constraints.txt and does not float these ranges.
    "numpy",
    "matplotlib",
    "pillow",
    "ase",
    # Pin MolCrysKit a54a922eb2d11dca3fafac2d63a19c603541ca4d, the reviewed
    # head of open PR 234. It includes Mercury read_mryx 0702ed8d and
    # lightweight CIF / phone-site a4080132, plus BondRecord.role,
    # connectivity, and disorder. It is not MolCrysKit main. Do not retarget
    # this URL to a later branch tip, and do not invent a PyPI version.
    # The desktop extra supplies ASE, pymatgen, SciPy, spglib, and
    # defusedxml. Core MolCrysKit is NumPy, NetworkX, and Click. read_mryx
    # imports defusedxml from the desktop extra, so this dependency requests
    # that extra. requirements/ci-constraints.txt names this same commit URL
    # without the extra marker: pip 26 rejects extras in a constraint.
    # identify_molecules defaults to as_refined; shell construction defaults
    # to major. Exclusive shell selection keeps whole orientations.
    "molcrys-kit[desktop] @ git+https://github.com/SchrodingersCattt/MolCrysKit.git@a54a922eb2d11dca3fafac2d63a19c603541ca4d",
]

[project.scripts]
mat-vis = "mat_viewer.cli:main"

[project.entry-points."mattervis.tui.renderers"]
"mattervis.native-v1" = "mat_viewer.tui.render_backend:create_native_renderer"

[project.optional-dependencies]
plotly = ["plotly"]
plotly-export = ["plotly", "kaleido"]
web = ["plotly", "dash", "flask-sock", "flask-compress"]
tui = ["textual"]
cube = ["scikit-image"]
animation = ["imageio", "imageio-ffmpeg"]
gpu = ["wgpu>=0.20"]
all = [
    "plotly",
    "kaleido",
    "dash",
    "flask-sock",
    "flask-compress",
    "textual",
    "scikit-image",
    "imageio",
    "imageio-ffmpeg",
    "wgpu>=0.20",
]
test = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-timeout",
    "pytest-xdist",
    "gemmi",
    "tomli; python_version < '3.11'",
]
dev = ["matter-vis[all,test]", "build", "ruff"]

[tool.setuptools.packages.find]
include = ["mat_viewer*"]

[tool.setuptools.package-data]
mat_viewer = ["render/assets/*.js"]
"mat_viewer._bundled_skills" = ["**/*"]

[tool.setuptools.exclude-package-data]
"mat_viewer._bundled_skills" = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]

[tool.setuptools_scm]
write_to = "mat_viewer/_version.py"
local_scheme = "no-local-version"
fallback_version = "0.0.0+unknown"
