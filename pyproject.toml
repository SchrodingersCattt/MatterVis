[build-system]
requires = ["setuptools>=68.0", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "matter-vis"
dynamic = ["version"]
description = "Publication-quality atomistic structure and trajectory visualization — CLI, browser viewer, animation, ORTEP, and terminal TUI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    # Library ranges stay here. The merge gate installs
    # requirements/ci-constraints.txt and does not float these ranges.
    "numpy",
    "matplotlib",
    "pillow",
    "ase",
    # MolCrysKit 2a3ee11e4c708b64691181cc2cbc4b2a3625f0c6 is the reviewed
    # commit of open PR 234 authorized for this pin. It is not a later
    # tip of that branch and it is not MolCrysKit main. It includes Mercury
    # read_mryx 0702ed8d, lightweight CIF / phone-site a4080132, and the
    # MRYX bounds on this commit: a single index validates every structure
    # and keeps only that structure; index=":" builds the full list before
    # returning. Labels are at most 128 characters, a document at most
    # 4,096 structures, and a structure at most 100,000 stored sites.
    # Synthetic documents exercise those bounds. They do not certify
    # Mercury. Do not retarget this URL to a later branch tip.
    # The desktop extra supplies ASE, pymatgen, SciPy, spglib, and
    # defusedxml. Core MolCrysKit is NumPy, NetworkX, and Click. read_mryx
    # imports defusedxml from the desktop extra. pyproject.toml requests
    # the extra; requirements/ci-constraints.txt repeats the same commit
    # URL without the extra marker because pip 26 rejects extras in
    # constraints. identify_molecules defaults to as_refined; shell
    # construction defaults to major.
    "molcrys-kit[desktop] @ git+https://github.com/SchrodingersCattt/MolCrysKit.git@2a3ee11e4c708b64691181cc2cbc4b2a3625f0c6",
]

[project.scripts]
mat-vis = "mat_viewer.cli:main"

[project.entry-points."mattervis.tui.renderers"]
"mattervis.native-v1" = "mat_viewer.tui.render_backend:create_native_renderer"

[project.optional-dependencies]
plotly = ["plotly"]
plotly-export = ["plotly", "kaleido"]
web = ["plotly", "dash", "flask-sock", "flask-compress"]
tui = ["textual"]
cube = ["scikit-image"]
animation = ["imageio", "imageio-ffmpeg"]
gpu = ["wgpu>=0.20"]
all = [
    "plotly",
    "kaleido",
    "dash",
    "flask-sock",
    "flask-compress",
    "textual",
    "scikit-image",
    "imageio",
    "imageio-ffmpeg",
    "wgpu>=0.20",
]
test = [
    "pytest>=8.0",
    "pytest-cov",
    "pytest-timeout",
    "pytest-xdist",
    "gemmi",
    "tomli; python_version < '3.11'",
]
dev = ["matter-vis[all,test]", "build", "ruff"]

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["mat_viewer*"]

[tool.setuptools.package-data]
mat_viewer = ["render/assets/*.js"]
"mat_viewer._bundled_skills" = ["**/*"]

[tool.setuptools.exclude-package-data]
"mat_viewer._bundled_skills" = ["**/__pycache__/*", "**/*.pyc", "**/*.pyo"]

[tool.setuptools_scm]
write_to = "mat_viewer/_version.py"
local_scheme = "no-local-version"
fallback_version = "0.0.0+unknown"
