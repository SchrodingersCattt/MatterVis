[build-system]
requires = ["setuptools>=68.0", "setuptools_scm[toml]>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "matter-vis"
dynamic = ["version"]
description = "Publication-quality atomistic structure and trajectory visualization — CLI, browser viewer, animation, ORTEP, and terminal TUI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Visualization",
]
dependencies = [
    "dash",
    "plotly",
    "numpy",
    "scipy",
    "scikit-image",
    "gemmi",
    "pymatgen",
    "kaleido",
    "flask-sock",
    "flask-compress",
    "matplotlib",
    "pillow",
    "imageio",
    "imageio-ffmpeg",
    "ase",
    "networkx",
    "textual",
    "molcrys-kit>=0.6.1",
]

[project.scripts]
mat-vis = "mat_viewer.cli:main"

[project.optional-dependencies]
test = ["pytest>=8.0", "pytest-cov", "pytest-timeout"]
dev = ["matter-vis[test]", "build", "ruff"]

[tool.setuptools.packages.find]
include = ["mat_viewer*"]

[tool.setuptools_scm]
write_to = "mat_viewer/_version.py"
local_scheme = "no-local-version"
fallback_version = "0.0.0+unknown"
